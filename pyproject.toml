[project]
name = "sustainability-data-agent"
version = "0.1.0"
description = "An agent that answers cross-source energy questions with two MCP servers: Energi Data Service (Danish grid) and Eurostat (EU statistics)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10,<3",
    "mcp>=2.3,<3",
    "anyio>=4",
    "tzdata; sys_platform == 'win32'",
    # The two MCP servers are installed from requirements.txt (pinned snapshots in vendor/),
    # not named here, so pip never fetches a same-named package from PyPI instead.
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sustainability-data-agent = "sustainability_data_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sustainability_data_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
